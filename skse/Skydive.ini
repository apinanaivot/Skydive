; Skydive settings. Also editable in game: F10 (iMenuKey) opens the options menu, which saves here.

[Input]
; Grapple key: DirectInput scan code (0x22 = G, 0x2F = V), or 256 + mouse button
; (256 left, 257 right, 258 middle, 259 / 260 side buttons). Decimal or 0x hex.
iGrappleKey=0x22
; Options menu key (F10 = 0x44), same codes. Esc also closes it.
iMenuKey=0x44
; Space in the air opens and closes the chute, Sneak lets go (both follow your Skyrim binds).

[Skydive]
; Seconds of falling, and meters of air still below, before a fall turns into the skydive (which
; takes no fall damage until it hits the ground). JC2: 0.6 s / 8 m.
fDelay=0.45
fMinHeight=7.5
; Hitting the ground in the skydive ragdolls you and deals Skyrim's fall damage for the height
; fallen, times this (0 = ragdoll only).
fLandingDamageMult=1.0
; 0: the skydive landing only ragdolls you when the fall kills you.
bLandingRagdoll=1

[Grapple]
; Loose objects up to this mass (Havok kg) are pulled to you; heavier ones you reel to. Hold the
; grapple key on one, let go aimed at another surface: the two are pulled together. Hooks on
; moving things (people, carts) move with them.
fPullMaxMass=250

[Features]
; Turn the grappling hook or the parachute off (the skydive always stays). Also in the in-game
; options menu (iMenuKey), which saves back to this file.
bGrapple=1
bParachute=1

[Stamina]
; Immersive stamina: each grapple shot costs fGrappleCost and can't be fired with less stamina;
; hanging on a wall or ceiling costs fHangCostPerSecond and lets go when it runs out. With
; bParachute, steering the chute costs fParachuteCostPerSecond at full input, and with no stamina
; left it steers at fExhaustedSteering of the input. Stamina doesn't regenerate while draining.
bEnabled=0
fGrappleCost=20
fHangCostPerSecond=2
bParachute=0
fParachuteCostPerSecond=10
fExhaustedSteering=0.3

[Ragdoll]
; Get up from a ragdoll (knockdowns, skydive landings) this many times faster than vanilla.
fGetUpSpeed=4.0

[Sound]
; Volume of JC2's grapple and parachute sounds, on top of Skyrim's Effects slider (they play as
; Skyrim sound effects, so reverb and audio mods apply to them too).
fVolume=1.0

[Debug]
; Print state changes (Falling -> Grappling, ...) to the console (~).
bNotify=0
